<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Rules decide, the AI note explains</title>
<desc id="d">20 SQL monitors raise 81 alerts over 90 days. SQL rules sort them into 24 pages, 7 fix today, 1 monitor and 49 auto-acknowledged. Each alert then gets an AI note with a likely cause, a first check and related alerts. The note cannot change the action. On-call receives the action and the note.</desc>
<defs><style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0ece4"/></marker>
</defs>
<rect width="1200" height="560" rx="24" fill="#0d0d0f"/><rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>

<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">LEDGERKITE · 90 DAYS</text>
<text x="54" y="104" class="sans" font-size="32" fill="#f0ece4" font-weight="700">Rules decide. The note explains.</text>
<rect x="54" y="160" width="240" height="200" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="74" y="192" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">MONITORS</text>
<text x="74" y="222" class="sans" font-size="20" fill="#f0ece4" font-weight="700">20 SQL checks</text>
<text x="74" y="254" class="sans" font-size="15" fill="#8a8680">freshness, volume, sums,</text>
<text x="74" y="280" class="sans" font-size="15" fill="#8a8680">nulls, duplicates, columns</text>
<text x="74" y="306" class="sans" font-size="15" fill="#f0ece4">81 alerts in 90 days</text>
<rect x="344" y="160" width="260" height="220" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="364" y="192" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">RULES · SQL · DECIDE</text>
<text x="364" y="222" class="sans" font-size="20" fill="#f0ece4" font-weight="700">One CASE expression</text>
<text x="364" y="254" class="sans" font-size="15" fill="#c0614a">24  page on-call</text>
<text x="364" y="280" class="sans" font-size="15" fill="#9085e9">7  fix today</text>
<text x="364" y="306" class="sans" font-size="15" fill="#c98500">1  monitor</text>
<text x="364" y="332" class="sans" font-size="15" fill="#7a9e7e">49  auto-acknowledge</text>
<rect x="654" y="160" width="250" height="200" rx="12" fill="#131311" stroke="#c8a96e" stroke-width="1.5"/>
<text x="674" y="192" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">AI NOTE · ADVISORY</text>
<text x="674" y="222" class="sans" font-size="20" fill="#f0ece4" font-weight="700">Claude, one call a day</text>
<text x="674" y="254" class="sans" font-size="15" fill="#8a8680">likely cause</text>
<text x="674" y="280" class="sans" font-size="15" fill="#8a8680">what to check first</text>
<text x="674" y="306" class="sans" font-size="15" fill="#8a8680">related alerts</text>
<rect x="954" y="160" width="200" height="200" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="974" y="192" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">ON-CALL</text>
<text x="974" y="222" class="sans" font-size="20" fill="#f0ece4" font-weight="700">Action + note</text>
<text x="974" y="254" class="sans" font-size="15" fill="#8a8680">decision from the rules,</text>
<text x="974" y="280" class="sans" font-size="15" fill="#8a8680">reasoning from the note</text>
<line x1="294" y1="260" x2="340" y2="260" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="604" y1="260" x2="650" y2="260" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="904" y1="260" x2="950" y2="260" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<path d="M779,360 C779,450 474,450 474,384" fill="none" stroke="#c0614a" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="610" y1="420" x2="640" y2="450" stroke="#c0614a" stroke-width="3"/><line x1="640" y1="420" x2="610" y2="450" stroke="#c0614a" stroke-width="3"/>
<text x="660" y="480" class="sans" font-size="16" fill="#8a8680">the note can disagree, but never changes the action</text>
</svg>