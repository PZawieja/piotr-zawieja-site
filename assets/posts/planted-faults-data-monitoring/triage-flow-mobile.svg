<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1180" viewBox="0 0 600 1180" role="img" aria-labelledby="t d">
<title id="t">Rules decide, the AI note explains</title>
<desc id="d">20 SQL monitors raise 81 alerts over 90 days. SQL rules sort them into 24 pages, 7 fix today, 1 monitor and 49 auto-acknowledged. Each alert then gets an AI note with a likely cause, a first check and related alerts. The note cannot change the action. On-call receives the action and the note.</desc>
<defs><style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0ece4"/></marker>
</defs>
<rect width="600" height="1180" rx="24" fill="#0d0d0f"/><rect x="1" y="1" width="598" height="1178" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>

<text x="40" y="56" class="mono" font-size="14" fill="#c8a96e" letter-spacing="3">LEDGERKITE · 90 DAYS</text>
<text x="40" y="96" class="sans" font-size="28" fill="#f0ece4" font-weight="700">Rules decide.</text>
<text x="40" y="132" class="sans" font-size="28" fill="#f0ece4" font-weight="700">The note explains.</text>
<rect x="80" y="170" width="440" height="200" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="100" y="202" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">MONITORS</text>
<text x="100" y="232" class="sans" font-size="20" fill="#f0ece4" font-weight="700">20 SQL checks</text>
<text x="100" y="264" class="sans" font-size="15" fill="#8a8680">freshness, volume, sums,</text>
<text x="100" y="290" class="sans" font-size="15" fill="#8a8680">nulls, duplicates, columns</text>
<text x="100" y="316" class="sans" font-size="15" fill="#f0ece4">81 alerts in 90 days</text>
<rect x="80" y="420" width="440" height="220" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="100" y="452" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">RULES · SQL · DECIDE</text>
<text x="100" y="482" class="sans" font-size="20" fill="#f0ece4" font-weight="700">One CASE expression</text>
<text x="100" y="514" class="sans" font-size="15" fill="#c0614a">24  page on-call</text>
<text x="100" y="540" class="sans" font-size="15" fill="#9085e9">7  fix today</text>
<text x="100" y="566" class="sans" font-size="15" fill="#c98500">1  monitor</text>
<text x="100" y="592" class="sans" font-size="15" fill="#7a9e7e">49  auto-acknowledge</text>
<rect x="80" y="700" width="440" height="200" rx="12" fill="#131311" stroke="#c8a96e" stroke-width="1.5"/>
<text x="100" y="732" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">AI NOTE · ADVISORY</text>
<text x="100" y="762" class="sans" font-size="20" fill="#f0ece4" font-weight="700">Claude, one call a day</text>
<text x="100" y="794" class="sans" font-size="15" fill="#8a8680">likely cause</text>
<text x="100" y="820" class="sans" font-size="15" fill="#8a8680">what to check first</text>
<text x="100" y="846" class="sans" font-size="15" fill="#8a8680">related alerts</text>
<rect x="80" y="950" width="440" height="180" rx="12" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="100" y="982" class="mono" font-size="12" fill="#8a8680" letter-spacing="2">ON-CALL</text>
<text x="100" y="1012" class="sans" font-size="20" fill="#f0ece4" font-weight="700">Action + note</text>
<text x="100" y="1044" class="sans" font-size="15" fill="#8a8680">decision from the rules,</text>
<text x="100" y="1070" class="sans" font-size="15" fill="#8a8680">reasoning from the note</text>
<line x1="300" y1="370" x2="300" y2="416" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="300" y1="640" x2="300" y2="696" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="300" y1="900" x2="300" y2="946" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<path d="M80,800 C30,800 30,530 76,530" fill="none" stroke="#c0614a" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="30" y1="650" x2="56" y2="676" stroke="#c0614a" stroke-width="3"/><line x1="56" y1="650" x2="30" y2="676" stroke="#c0614a" stroke-width="3"/>
<text x="80" y="1165" class="sans" font-size="15" fill="#8a8680">The note can disagree, but never changes the action.</text>
</svg>