<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="tm dm">
<title id="tm">Where hooks sit in one Claude Code turn</title>
<desc id="dm">CLAUDE.md feeds the model as context. Three gates follow: PreToolUse denies risky Bash commands, PostToolUse lints the edited SQL file and returns errors, Stop runs dbt build and sends Claude back to work if it fails.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8680"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
</defs>
<rect width="600" height="820" rx="20" fill="#0d0d0f"/>
<rect x="1" y="1" width="598" height="818" rx="19" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="36" y="54" class="mono" font-size="14" fill="#c8a96e" letter-spacing="3">ONE CLAUDE CODE TURN</text>
<text x="36" y="94" class="sans" font-size="28" fill="#f0ece4" font-weight="700">CLAUDE.md asks.</text>
<text x="36" y="128" class="sans" font-size="28" fill="#f0ece4" font-weight="700">Hooks check.</text>

<rect x="60" y="160" width="400" height="64" rx="10" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="80" y="188" class="mono" font-size="16" fill="#8a8680">CLAUDE.md</text>
<text x="80" y="212" class="sans" font-size="14" fill="#5a5650">read as context, weighed</text>
<path d="M260 224 V 254" stroke="#5a5650" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#mw)"/>

<rect x="60" y="258" width="400" height="64" rx="10" fill="#131311" stroke="#8a8680" stroke-width="2"/>
<text x="80" y="286" class="sans" font-size="18" font-weight="700" fill="#f0ece4">Claude decides</text>
<text x="80" y="310" class="sans" font-size="14" fill="#8a8680">edit a model, run a command</text>
<path d="M260 322 V 352" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#mw)"/>

<rect x="60" y="356" width="400" height="84" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="80" y="382" class="mono" font-size="13" fill="#c8a96e">PreToolUse · Bash</text>
<text x="80" y="406" class="sans" font-size="15" fill="#f0ece4">prod target, full refresh, DROP</text>
<text x="80" y="428" class="sans" font-size="15" fill="#c0614a">→ deny, reason to Claude</text>
<path d="M260 440 V 470" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#mw)"/>

<rect x="60" y="474" width="400" height="84" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="80" y="500" class="mono" font-size="13" fill="#c8a96e">PostToolUse · Edit|Write</text>
<text x="80" y="524" class="sans" font-size="15" fill="#f0ece4">sqlfluff lint the edited file</text>
<text x="80" y="546" class="sans" font-size="15" fill="#c0614a">→ exit 2, errors to Claude</text>
<path d="M260 558 V 588" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#mw)"/>

<rect x="60" y="592" width="400" height="106" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="80" y="618" class="mono" font-size="13" fill="#c8a96e">Stop</text>
<text x="80" y="642" class="sans" font-size="15" fill="#f0ece4">dbt build changed models+</text>
<text x="80" y="664" class="sans" font-size="15" fill="#7a9e7e">passes → turn ends</text>
<text x="80" y="686" class="sans" font-size="15" fill="#c0614a">fails → block, keep working</text>

<path d="M460 516 H 520 V 290 H 464" stroke="#c0614a" stroke-width="2" fill="none" marker-end="url(#mr)"/>
<path d="M460 645 H 540 V 280 H 464" stroke="#c0614a" stroke-width="2" fill="none" marker-end="url(#mr)"/>

<text x="36" y="760" class="sans" font-size="14" fill="#5a5650">Gold boxes run as code on every matching</text>
<text x="36" y="782" class="sans" font-size="14" fill="#5a5650">event, whatever the model remembers.</text>
</svg>
