<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Where hooks sit in one Claude Code turn</title>
<desc id="d">CLAUDE.md feeds the model as context, drawn as a dashed line. The turn runs through three gates: a PreToolUse gate that can deny a Bash command before it runs, a PostToolUse check that lints the edited SQL file and sends errors back to Claude, and a Stop gate that runs dbt build and sends Claude back to work if it fails.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8680"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8a96e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
</defs>
<rect width="1200" height="640" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">ONE CLAUDE CODE TURN</text>
<text x="54" y="104" class="sans" font-size="32" fill="#f0ece4" font-weight="700">CLAUDE.md asks. Hooks check.</text>

<rect x="54" y="150" width="250" height="84" rx="10" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="179" y="186" text-anchor="middle" class="mono" font-size="18" fill="#8a8680">CLAUDE.md</text>
<text x="179" y="214" text-anchor="middle" class="sans" font-size="15" fill="#5a5650">read as context, weighed</text>
<path d="M304 192 H 420" stroke="#5a5650" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#aw)"/>

<rect x="425" y="150" width="250" height="84" rx="10" fill="#131311" stroke="#8a8680" stroke-width="2"/>
<text x="550" y="186" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#f0ece4">Claude decides</text>
<text x="550" y="214" text-anchor="middle" class="sans" font-size="15" fill="#8a8680">edit a model, run a command</text>

<path d="M550 234 V 300" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#aw)"/>

<rect x="300" y="305" width="500" height="64" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="320" y="333" class="mono" font-size="14" fill="#c8a96e">PreToolUse · matcher Bash</text>
<text x="320" y="356" class="sans" font-size="17" fill="#f0ece4">--target prod? full refresh? DROP? → deny</text>
<path d="M800 337 H 840" stroke="#c0614a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="850" y="331" class="sans" font-size="16" fill="#c0614a" font-weight="700">denied</text>
<text x="850" y="353" class="sans" font-size="14" fill="#8a8680">reason goes to Claude</text>

<path d="M550 369 V 405" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#aw)"/>
<rect x="470" y="410" width="160" height="40" rx="8" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="550" y="436" text-anchor="middle" class="sans" font-size="16" fill="#8a8680">tool runs</text>
<path d="M550 450 V 476" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#aw)"/>

<rect x="300" y="481" width="500" height="64" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="320" y="509" class="mono" font-size="14" fill="#c8a96e">PostToolUse · matcher Edit|Write</text>
<text x="320" y="532" class="sans" font-size="17" fill="#f0ece4">sqlfluff lint the file → exit 2 on violations</text>
<path d="M300 513 H 250 V 270 H 480 V 240" stroke="#c0614a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="110" y="400" class="sans" font-size="14" fill="#c0614a">errors back</text>
<text x="110" y="420" class="sans" font-size="14" fill="#c0614a">to Claude</text>

<path d="M800 513 H 1005 V 292" stroke="#8a8680" stroke-width="2" fill="none" marker-end="url(#aw)"/>
<text x="1020" y="420" class="sans" font-size="14" fill="#8a8680">wants to</text>
<text x="1020" y="440" class="sans" font-size="14" fill="#8a8680">finish</text>

<rect x="860" y="150" width="290" height="136" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="2.5"/>
<text x="880" y="180" class="mono" font-size="14" fill="#c8a96e">Stop</text>
<text x="880" y="208" class="sans" font-size="17" fill="#f0ece4">dbt build changed models+</text>
<text x="880" y="240" class="sans" font-size="16" fill="#7a9e7e">passes → turn ends</text>
<text x="880" y="268" class="sans" font-size="16" fill="#c0614a">fails → "block", keep working</text>
<path d="M860 230 H 680" stroke="#c0614a" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<text x="54" y="600" class="sans" font-size="15" fill="#5a5650">Gold boxes run as code on every matching event, whatever the model remembers.</text>
</svg>
