<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">One branch from request to merge</title>
<desc id="d">A branch leaves a fresh main with two commits. Ana merges a change to main. Rebase copies the two commits onto the new main, leaving the originals behind. The branch is then squash-merged into main.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8680"/></marker>
</defs>
<rect width="1200" height="640" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">TELHADO · FICTIONAL</text>
<text x="54" y="104" class="sans" font-size="32" fill="#f0ece4" font-weight="700">One request, one branch, start to finish</text>
<text x="54" y="226" class="mono" font-size="14" fill="#c8a96e">feat/capacity-factor-installed-kw</text>
<text x="54" y="438" class="mono" font-size="14" fill="#8a8680">main</text>
<line x1="54" y1="460" x2="1146" y2="460" stroke="#f0ece4" stroke-width="3"/>
<line x1="110" y1="460" x2="240" y2="310" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="240" y1="310" x2="380" y2="310" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="520" y1="460" x2="680" y2="310" stroke="#c8a96e" stroke-width="3"/>
<line x1="680" y1="310" x2="830" y2="310" stroke="#c8a96e" stroke-width="3"/>
<path d="M410,310 L646,310" stroke="#8a8680" stroke-width="2" stroke-dasharray="5 6" fill="none" marker-end="url(#ad)"/>
<text x="528" y="344" text-anchor="middle" class="mono" font-size="14" fill="#8a8680">8 · rebase onto new main</text>
<line x1="830" y1="310" x2="1036" y2="452" stroke="#7a9e7e" stroke-width="3" marker-end="url(#ag)"/>
<text x="960" y="360" class="mono" font-size="14" fill="#7a9e7e">9 · squash merge</text>
<text x="182" y="414" class="mono" font-size="13" fill="#8a8680">2 · branch</text>
<circle cx="110" cy="460" r="14" fill="#f0ece4"/>
<text x="110" y="500" text-anchor="middle" class="sans" font-size="15" fill="#f0ece4" font-weight="700">1 · fresh main</text>
<circle cx="520" cy="460" r="14" fill="#f0ece4"/>
<text x="520" y="500" text-anchor="middle" class="sans" font-size="15" fill="#f0ece4" font-weight="700">Ana: ROUND(…, 4)</text>
<text x="520" y="522" text-anchor="middle" class="sans" font-size="14" fill="#8a8680">merged while you wait</text>
<circle cx="1050" cy="460" r="16" fill="#7a9e7e"/>
<text x="1050" y="500" text-anchor="middle" class="sans" font-size="15" fill="#7a9e7e" font-weight="700">one squash commit</text>
<text x="1050" y="522" text-anchor="middle" class="sans" font-size="14" fill="#8a8680">then 9 · branch -D</text>
<circle cx="240" cy="310" r="12" fill="#0d0d0f" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="240" y="276" text-anchor="middle" class="sans" font-size="15" fill="#8a8680">5 · commit</text>
<circle cx="380" cy="310" r="12" fill="#0d0d0f" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="380" y="276" text-anchor="middle" class="sans" font-size="15" fill="#8a8680">7 · review fix</text>
<circle cx="680" cy="310" r="13" fill="#c8a96e"/>
<text x="680" y="276" text-anchor="middle" class="sans" font-size="15" fill="#c8a96e">5, new hash</text>
<circle cx="830" cy="310" r="13" fill="#c8a96e"/>
<text x="830" y="276" text-anchor="middle" class="sans" font-size="15" fill="#c8a96e">7, new hash</text>
<text x="830" y="252" text-anchor="middle" class="mono" font-size="13" fill="#c8a96e">push --force-with-lease</text>
<text x="54" y="590" class="sans" font-size="16" fill="#8a8680">Dashed: the original commits. Rebase copies them; the reflog keeps the originals for 30 days.</text>
</svg>
