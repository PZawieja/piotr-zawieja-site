<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" role="img" aria-labelledby="t d">
<title id="t">One branch from request to merge</title>
<desc id="d">A branch leaves a fresh main with two commits. Ana merges a change to main. Rebase copies the two commits onto the new main, leaving the originals behind. The branch is then squash-merged into main.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8680"/></marker>
</defs>
<rect width="600" height="1000" rx="20" fill="#0d0d0f"/>
<rect x="1" y="1" width="598" height="998" rx="19" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="36" y="54" class="mono" font-size="14" fill="#c8a96e" letter-spacing="2">TELHADO · FICTIONAL</text>
<text x="36" y="92" class="sans" font-size="26" fill="#f0ece4" font-weight="700">One request, one branch,</text>
<text x="36" y="124" class="sans" font-size="26" fill="#f0ece4" font-weight="700">start to finish</text>
<text x="66" y="172" text-anchor="middle" class="mono" font-size="14" fill="#8a8680">main</text>
<line x1="66" y1="186" x2="66" y2="900" stroke="#f0ece4" stroke-width="3"/>
<line x1="66" y1="210" x2="170" y2="300" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="170" y1="300" x2="170" y2="390" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="66" y1="480" x2="270" y2="570" stroke="#c8a96e" stroke-width="3"/>
<line x1="270" y1="570" x2="270" y2="660" stroke="#c8a96e" stroke-width="3"/>
<line x1="270" y1="660" x2="76" y2="822" stroke="#7a9e7e" stroke-width="3" marker-end="url(#ag)"/>
<path d="M182,400 L258,556" stroke="#8a8680" stroke-width="2" stroke-dasharray="5 6" fill="none" marker-end="url(#ad)"/>
<circle cx="66" cy="210" r="12" fill="#f0ece4"/>
<circle cx="170" cy="300" r="11" fill="#0d0d0f" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="4 3"/>
<circle cx="170" cy="390" r="11" fill="#0d0d0f" stroke="#5a5650" stroke-width="2.5" stroke-dasharray="4 3"/>
<circle cx="66" cy="480" r="12" fill="#f0ece4"/>
<circle cx="270" cy="570" r="12" fill="#c8a96e"/>
<circle cx="270" cy="660" r="12" fill="#c8a96e"/>
<circle cx="66" cy="830" r="14" fill="#7a9e7e"/>
<text x="330" y="216" class="sans" font-size="17" fill="#f0ece4" font-weight="700">1 · fresh main</text>
<text x="330" y="294" class="sans" font-size="17" fill="#8a8680">2 · branch</text>
<text x="330" y="316" class="sans" font-size="17" fill="#8a8680">5 · commit</text>
<text x="330" y="396" class="sans" font-size="17" fill="#8a8680">7 · review fix</text>
<text x="330" y="474" class="sans" font-size="17" fill="#f0ece4" font-weight="700">Ana: ROUND(…, 4)</text>
<text x="330" y="496" class="sans" font-size="15" fill="#8a8680">merged while you wait</text>
<text x="330" y="566" class="mono" font-size="15" fill="#8a8680">8 · rebase</text>
<text x="330" y="588" class="sans" font-size="17" fill="#c8a96e">5, new hash</text>
<text x="330" y="656" class="sans" font-size="17" fill="#c8a96e">7, new hash</text>
<text x="330" y="678" class="mono" font-size="13" fill="#c8a96e">push --force-with-lease</text>
<text x="330" y="826" class="sans" font-size="17" fill="#7a9e7e" font-weight="700">9 · squash merge</text>
<text x="330" y="848" class="sans" font-size="15" fill="#8a8680">then branch -D</text>
<text x="36" y="950" class="sans" font-size="15" fill="#8a8680">Dashed: the original commits. Rebase copies</text>
<text x="36" y="972" class="sans" font-size="15" fill="#8a8680">them; the reflog keeps them for 30 days.</text>
</svg>
