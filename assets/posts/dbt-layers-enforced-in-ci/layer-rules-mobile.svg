<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100" role="img" aria-labelledby="t d">
<title id="t">Three dbt layer rules</title>
<desc id="d">Allowed edges flow from sources to staging to intermediate to marts. Forbidden edges: a source into a mart, staging into staging, and a mart back into staging.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
</defs>
<rect width="600" height="1100" rx="20" fill="#0d0d0f"/>
<rect x="1" y="1" width="598" height="1098" rx="19" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="36" y="54" class="mono" font-size="14" fill="#c8a96e" text-anchor="start" font-weight="400" letter-spacing="2">BANGKA LINES · FICTIONAL</text>
<text x="36" y="94" class="sans" font-size="30" fill="#f0ece4" text-anchor="start" font-weight="700" letter-spacing="0">One layer at a time</text>
<text x="36" y="148" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">SOURCES</text>
<rect x="36" y="160" width="528" height="56" rx="8" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="300.0" y="193.0" text-anchor="middle" class="mono" font-size="19" fill="#8a8680">booking.bookings</text>
<line x1="300" y1="220" x2="300" y2="250" stroke="#7a9e7e" stroke-width="2" marker-end="url(#ag)"/>
<text x="36" y="278" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">STAGING</text>
<rect x="36" y="290" width="528" height="56" rx="8" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="300.0" y="323.0" text-anchor="middle" class="mono" font-size="19" fill="#f0ece4">stg_booking__bookings</text>
<line x1="300" y1="350" x2="300" y2="380" stroke="#7a9e7e" stroke-width="2" marker-end="url(#ag)"/>
<text x="36" y="408" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">INTERMEDIATE</text>
<rect x="36" y="420" width="528" height="56" rx="8" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="300.0" y="453.0" text-anchor="middle" class="mono" font-size="19" fill="#f0ece4">int_bookings_with_route</text>
<line x1="300" y1="480" x2="300" y2="510" stroke="#7a9e7e" stroke-width="2" marker-end="url(#ag)"/>
<text x="36" y="538" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">MARTS</text>
<rect x="36" y="550" width="528" height="56" rx="8" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="300.0" y="583.0" text-anchor="middle" class="mono" font-size="19" fill="#c8a96e">fct_route_revenue</text>
<line x1="36" y1="660" x2="564" y2="660" stroke="#2a2924" stroke-width="1.5"/>
<text x="36" y="700" class="mono" font-size="14" fill="#c0614a" text-anchor="start" font-weight="400" letter-spacing="2">FORBIDDEN EDGES</text>
<text x="36" y="736" class="sans" font-size="17" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 1 · only staging reads a source</text>
<rect x="36" y="750" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="156.0" y="777.0" text-anchor="middle" class="mono" font-size="13" fill="#8a8680">booking.bookings</text>
<line x1="282" y1="772" x2="316" y2="772" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="324" y="750" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="444.0" y="777.0" text-anchor="middle" class="mono" font-size="13" fill="#c8a96e">fct_sailing_load</text>
<text x="36" y="836" class="sans" font-size="17" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 2 · staging reads only its source</text>
<rect x="36" y="850" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="156.0" y="877.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_booking__sailings</text>
<line x1="282" y1="872" x2="316" y2="872" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="324" y="850" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="444.0" y="877.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_booking__bookings</text>
<text x="36" y="936" class="sans" font-size="17" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 2 · nothing flows backwards</text>
<rect x="36" y="950" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="156.0" y="977.0" text-anchor="middle" class="mono" font-size="13" fill="#c8a96e">fct_route_revenue</text>
<line x1="282" y1="972" x2="316" y2="972" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="324" y="950" width="240" height="44" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="444.0" y="977.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_route_summary</text>
<text x="36" y="1040" class="sans" font-size="17" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="0">Rule 3 · the prefix decides which</text>
<text x="36" y="1066" class="sans" font-size="17" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="0">rules a model is judged by.</text>
</svg>