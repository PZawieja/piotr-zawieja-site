<line x1="860" y1="249" x2="896" y2="249" stroke="#7a9e7e" stroke-width="2" marker-end="url(#ag)"/>
<line x1="860" y1="329" x2="896" y2="329" stroke="#7a9e7e" stroke-width="2" marker-end="url(#ag)"/>
<line x1="54" y1="430" x2="1146" y2="430" stroke="#2a2924" stroke-width="1.5"/>
<text x="60" y="474" class="mono" font-size="14" fill="#c0614a" text-anchor="start" font-weight="400" letter-spacing="2">FORBIDDEN EDGES</text>
<text x="60" y="512" class="sans" font-size="15" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 1 · only staging reads a source</text>
<rect x="60" y="530" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="220.0" y="555.0" text-anchor="middle" class="mono" font-size="13" fill="#8a8680">booking.bookings</text>
<line x1="220" y1="572" x2="220" y2="600" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="60" y="604" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="220.0" y="629.0" text-anchor="middle" class="mono" font-size="13" fill="#c8a96e">fct_sailing_load</text>
<text x="430" y="512" class="sans" font-size="15" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 2 · staging reads only its source</text>
<rect x="430" y="530" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="590.0" y="555.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_booking__sailings</text>
<line x1="590" y1="572" x2="590" y2="600" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="430" y="604" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="590.0" y="629.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_booking__bookings</text>
<text x="800" y="512" class="sans" font-size="15" fill="#f0ece4" text-anchor="start" font-weight="600" letter-spacing="0">Rule 2 · nothing flows backwards</text>
<rect x="800" y="530" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="960.0" y="555.0" text-anchor="middle" class="mono" font-size="13" fill="#c8a96e">fct_route_revenue</text>
<line x1="960" y1="572" x2="960" y2="600" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar)"/>
<rect x="800" y="604" width="320" height="40" rx="8" fill="#131311" stroke="#c0614a" stroke-width="1.5"/><text x="960.0" y="629.0" text-anchor="middle" class="mono" font-size="13" fill="#f0ece4">stg_route_summary</text>
<text x="60" y="690" class="sans" font-size="16" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="0">Rule 3 · the prefix decides which column a model is judged in. A wrong name means the wrong rules get applied.</text>
</svg>