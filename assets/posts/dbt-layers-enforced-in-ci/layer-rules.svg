<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d">
<title id="t">Three dbt layer rules</title>
<desc id="d">Allowed edges flow from sources to staging to intermediate to marts. Forbidden edges: a source into a mart, staging into staging, and a mart back into staging.</desc>
<defs>
<style>
