<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
</defs>
<rect width="1200" height="740" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="738" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" text-anchor="start" font-weight="400" letter-spacing="3">BANGKA LINES · FICTIONAL</text>
<text x="54" y="104" class="sans" font-size="32" fill="#f0ece4" text-anchor="start" font-weight="700" letter-spacing="0">Edges move one layer to the right</text>
