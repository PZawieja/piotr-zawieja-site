<text x="620" y="160" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">INTERMEDIATE</text>
<text x="900" y="160" class="mono" font-size="14" fill="#8a8680" text-anchor="start" font-weight="400" letter-spacing="2">MARTS</text>
