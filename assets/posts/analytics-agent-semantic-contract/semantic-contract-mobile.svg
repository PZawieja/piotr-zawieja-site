<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="title desc">
  <title id="title">From a business question to a governed analytics answer</title>
  <desc id="desc">A vertical diagram for small screens. A question becomes a defined metric contract, passes through an authorized query service, and returns a synthetic answer with its definition and date range.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#77d6a5"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="720" height="1580" rx="26" fill="#121a1e"/>
  <rect x="1" y="1" width="718" height="1578" rx="25" fill="none" stroke="#35433e" stroke-width="2"/>

  <text x="40" y="62" class="mono" font-size="21" letter-spacing="2.5" fill="#77d6a5">FIELD GUIDE · 01</text>
  <text x="40" y="112" class="sans" font-size="34" font-weight="700" fill="#eff6f1">From question to a governed answer</text>
  <text x="40" y="151" class="sans" font-size="23" fill="#a4b1ac">The agent interprets. The contract defines.</text>

  <rect x="32" y="190" width="656" height="195" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="235" class="mono" font-size="20" letter-spacing="1.5" fill="#e2bd73">1 · THE QUESTION</text>
  <text x="62" y="291" class="sans" font-size="31" font-weight="600" fill="#eff6f1">
    <tspan x="62" dy="0">“How much did we sell in</tspan>
    <tspan x="62" dy="42">Germany last week?”</tspan>
  </text>
  <path d="M360 395v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="32" y="442" width="656" height="486" rx="18" fill="#1b272b" stroke="#77d6a5" stroke-width="2"/>
  <text x="62" y="485" class="mono" font-size="20" letter-spacing="1.2" fill="#77d6a5">2 · THE SEMANTIC CONTRACT</text>
  <rect x="58" y="508" width="604" height="64" rx="10" fill="#202e32"/>
  <text x="82" y="551" class="mono" font-size="29" font-weight="600" fill="#d5fa79">paid_item_sales</text>

  <text x="62" y="619" class="sans" font-size="21" fill="#a4b1ac">Definition</text>
  <text x="205" y="619" class="sans" font-size="22" fill="#eff6f1">After discounts · before refunds</text>
  <path d="M62 638h596" stroke="#35433e" stroke-width="2"/>
  <text x="62" y="686" class="sans" font-size="21" fill="#a4b1ac">Grain</text>
  <text x="205" y="686" class="sans" font-size="22" fill="#eff6f1">One paid order line</text>
  <path d="M62 705h596" stroke="#35433e" stroke-width="2"/>
  <text x="62" y="753" class="sans" font-size="21" fill="#a4b1ac">Time</text>
  <text x="205" y="753" class="sans" font-size="22" fill="#eff6f1">paid_at · Mon–Sun · Berlin</text>
  <path d="M62 772h596" stroke="#35433e" stroke-width="2"/>
  <text x="62" y="820" class="sans" font-size="21" fill="#a4b1ac">Country</text>
  <text x="205" y="820" class="sans" font-size="22" fill="#eff6f1">Ship-to · not billing</text>
  <path d="M62 839h596" stroke="#35433e" stroke-width="2"/>
  <text x="62" y="887" class="sans" font-size="21" fill="#a4b1ac">Unit / scope</text>
  <text x="205" y="887" class="sans" font-size="22" fill="#eff6f1">EUR · no tax or shipping</text>

  <path d="M360 938v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="32" y="985" width="656" height="205" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="1030" class="mono" font-size="20" letter-spacing="1.2" fill="#8ecff0">3 · THE QUERY SERVICE</text>
  <text x="62" y="1080" class="sans" font-size="26" font-weight="600" fill="#eff6f1">Approved metric · typed filters</text>
  <text x="62" y="1122" class="sans" font-size="22" fill="#a4b1ac">Valid joins · role-checked access</text>
  <text x="62" y="1160" class="mono" font-size="19" fill="#84928c">No free-form SQL from the prompt</text>

  <path d="M360 1200v30" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="32" y="1245" width="656" height="194" rx="18" fill="#202e32" stroke="#77d6a5" stroke-width="2"/>
  <text x="62" y="1288" class="mono" font-size="19" letter-spacing="1.2" fill="#77d6a5">SYNTHETIC ANSWER</text>
  <text x="62" y="1350" class="sans" font-size="42" font-weight="700" fill="#d5fa79">€160</text>
  <text x="195" y="1349" class="sans" font-size="23" fill="#eff6f1">· ship-to Germany</text>
  <text x="62" y="1395" class="sans" font-size="22" fill="#a4b1ac">9–15 Nov · Europe/Berlin</text>

  <rect x="32" y="1470" width="656" height="76" rx="12" fill="#202e32"/>
  <text x="54" y="1502" class="sans" font-size="20" fill="#a4b1ac">
    <tspan x="54" dy="0">A contract narrows mistakes; it cannot repair</tspan>
    <tspan x="54" dy="27">bad data or settle an unmade business decision.</tspan>
  </text>
</svg>
