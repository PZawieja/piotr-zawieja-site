<svg xmlns="http://www.w3.org/2000/svg" width="600" height="980" viewBox="0 0 600 980" role="img" aria-labelledby="t d">
<title id="t">How a data pull request gets reviewed</title>
<desc id="d">The author opens a draft, CI runs dbt build and the linter, the author marks it ready, the reviewer checks numbers, grain, tests, downstream and nits within one business day, then either requests changes, which loops back to the author, or approves, which leads to a squash merge.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0ece4"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
</defs>
<rect width="600" height="980" rx="20" fill="#0d0d0f"/><rect x="1" y="1" width="598" height="978" rx="19" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="36" y="54" class="mono" font-size="14" fill="#c8a96e" letter-spacing="2">TELHADO · PR #42</text>
<text x="36" y="92" class="sans" font-size="26" fill="#f0ece4" font-weight="700">Machines first, then a person,</text><text x="36" y="124" class="sans" font-size="26" fill="#f0ece4" font-weight="700">in a fixed order</text>
<rect x="90" y="160" width="420" height="84" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="110" y="186" class="mono" font-size="13" fill="#8a8680" letter-spacing="2">AUTHOR</text><text x="110" y="212" class="sans" font-size="19" fill="#f0ece4" font-weight="700">Open a draft</text><text x="110" y="234" class="sans" font-size="15" fill="#8a8680">description filled in</text>
<rect x="90" y="290" width="420" height="84" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="110" y="316" class="mono" font-size="13" fill="#8a8680" letter-spacing="2">CI</text><text x="110" y="342" class="sans" font-size="19" fill="#f0ece4" font-weight="700">dbt build + linter</text><text x="110" y="364" class="sans" font-size="15" fill="#8a8680">style caught here</text>
<rect x="90" y="420" width="420" height="84" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/><text x="110" y="446" class="mono" font-size="13" fill="#8a8680" letter-spacing="2">AUTHOR</text><text x="110" y="472" class="sans" font-size="19" fill="#f0ece4" font-weight="700">Ready for review</text><text x="110" y="494" class="sans" font-size="15" fill="#8a8680">CI green</text>
<rect x="90" y="550" width="420" height="150" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="1.5"/><text x="110" y="576" class="mono" font-size="13" fill="#8a8680" letter-spacing="2">REVIEWER</text><text x="110" y="602" class="sans" font-size="19" fill="#f0ece4" font-weight="700">Review in order</text><text x="110" y="626" class="sans" font-size="15" fill="#8a8680">within one business day</text><text x="110" y="658" class="mono" font-size="15" fill="#c8a96e">numbers → grain → tests</text><text x="110" y="682" class="mono" font-size="15" fill="#c8a96e">→ downstream → nits</text>
<rect x="90" y="790" width="420" height="70" rx="10" fill="#131311" stroke="#7a9e7e" stroke-width="1.5"/><text x="300" y="832" text-anchor="middle" class="sans" font-size="19" fill="#7a9e7e" font-weight="700">Squash merge</text>
<line x1="300" y1="244" x2="300" y2="286" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="300" y1="374" x2="300" y2="416" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="300" y1="504" x2="300" y2="546" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<line x1="300" y1="700" x2="300" y2="786" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/><text x="314" y="750" class="mono" font-size="15" fill="#7a9e7e">Approve</text>
<path d="M90,625 L52,625 L52,202 L86,202" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)"/>
<text x="34" y="420" class="mono" font-size="14" fill="#c0614a" transform="rotate(-90 34 420)" text-anchor="middle">Request changes → new commits</text>
<text x="36" y="920" class="sans" font-size="15" fill="#8a8680">Request changes only for what would break</text><text x="36" y="942" class="sans" font-size="15" fill="#8a8680">numbers. Everything else is a comment.</text>
</svg>
