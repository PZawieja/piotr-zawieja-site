<text x="400.0" y="1208.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">one set of Iceberg files</text>
<rect x="70" y="1160" width="140" height="60" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="140.0" y="1196.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">Snowflake</text>
<line x1="210" y1="1190" x2="236" y2="1190" stroke="#8a8680" stroke-width="2.5" marker-end="url(#am)"/>
<text x="140" y="1250" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle" font-weight="400" letter-spacing="0">reads directly</text>
<text x="315" y="1300" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7a9e7e" text-anchor="middle" font-weight="400" letter-spacing="0">grants, ACCESS_HISTORY, one current version</text>
