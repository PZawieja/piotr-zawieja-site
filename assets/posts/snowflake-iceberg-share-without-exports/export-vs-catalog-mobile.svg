<text x="310.0" y="265.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">Snowflake table</text>
<line x1="310" y1="284" x2="310" y2="330" stroke="#8a8680" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="190" y="332" width="240" height="74" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="310.0" y="363.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">Export task</text>
<text x="310.0" y="387.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">02:00 unload</text>
