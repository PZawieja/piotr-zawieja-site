<text x="310.0" y="509.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">copy · bucket keys only</text>
<line x1="240" y1="528" x2="170" y2="598" stroke="#c0614a" stroke-width="2.5" marker-end="url(#ar)" stroke-dasharray="7 6"/>
