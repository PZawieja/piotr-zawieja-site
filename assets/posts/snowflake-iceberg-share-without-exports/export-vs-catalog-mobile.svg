<line x1="330" y1="874" x2="330" y2="956" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="490" y1="874" x2="434.0" y2="956" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="120" y="958" width="440" height="112" rx="12" fill="#131311" stroke="#c8a96e" stroke-width="2"/>
<text x="340.0" y="1008.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#c8a96e" text-anchor="middle">Horizon Catalog</text>
<text x="340.0" y="1032.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">checks the role · vends short-lived credentials</text>
<line x1="400" y1="1070" x2="400" y2="1140" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="240" y="1142" width="320" height="96" rx="12" fill="#131311" stroke="#7a9e7e" stroke-width="2"/>
