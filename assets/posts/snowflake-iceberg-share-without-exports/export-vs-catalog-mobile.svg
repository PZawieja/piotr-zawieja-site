<rect x="350" y="600" width="200" height="74" rx="12" fill="#131311" stroke="#c0614a" stroke-width="2" stroke-dasharray="7 6"/>
<text x="450.0" y="631.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">DuckDB laptop</text>
<text x="450.0" y="655.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8680" text-anchor="middle">last week's copy</text>
<text x="310" y="706" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c0614a" text-anchor="middle" font-weight="400" letter-spacing="0">no grants · no masking · no audit trail</text>
<rect x="120" y="810" width="120" height="64" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="180.0" y="848.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">Spark</text>
<rect x="270" y="810" width="120" height="64" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="330.0" y="848.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">Trino</text>
<rect x="420" y="810" width="140" height="64" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
<text x="490.0" y="848.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#f0ece4" text-anchor="middle">DuckDB</text>
