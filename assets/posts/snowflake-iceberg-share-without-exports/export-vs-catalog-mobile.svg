<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1360" viewBox="0 0 620 1360" role="img" aria-labelledby="t d">
<title id="t">Nightly export versus Iceberg table behind Horizon Catalog</title>
<desc id="d">Before: a Snowflake table is unloaded nightly to a bucket and Spark and DuckDB read stale copies with no Snowflake grants. After: Spark, Trino and DuckDB go through Horizon Catalog, which checks the role and vends short-lived credentials to read one Iceberg table, which Snowflake itself reads directly.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0614a"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8680"/></marker>
</defs>
<rect width="620" height="1360" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="618" height="1358" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="54" y="62" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c8a96e" text-anchor="start" font-weight="400" letter-spacing="3">SALAR NORTE · FICTIONAL</text>
<text x="54" y="104" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" fill="#f0ece4" text-anchor="start" font-weight="700" letter-spacing="0">One table, read in place</text>
<rect x="40" y="140" width="540" height="580" rx="18" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="70" y="182" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#c0614a" text-anchor="start" font-weight="400" letter-spacing="2">BEFORE · NIGHTLY EXPORT</text>
<rect x="40" y="740" width="540" height="580" rx="18" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="70" y="782" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7a9e7e" text-anchor="start" font-weight="400" letter-spacing="2">AFTER · ICEBERG + HORIZON CATALOG</text>
<rect x="190" y="210" width="240" height="74" rx="12" fill="#131311" stroke="#2a2924" stroke-width="2"/>
