<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Where your git code lives</title>
<desc id="d">Your laptop holds a working folder, local branches and an origin/main snapshot. GitHub holds origin. Commit moves work from the folder to local branches, push uploads branches to origin, fetch refreshes the snapshot from origin, and pull, rebase or merge bring the snapshot into your branches.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8a96e"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0ece4"/></marker>
</defs>
<rect width="1200" height="700" rx="24" fill="#0d0d0f"/>
<rect x="1" y="1" width="1198" height="698" rx="23" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="54" y="62" class="mono" font-size="15" fill="#c8a96e" letter-spacing="3">TELHADO · FICTIONAL</text>
<text x="54" y="104" class="sans" font-size="32" fill="#f0ece4" font-weight="700">Your code lives in four places</text>
<rect x="40" y="140" width="770" height="460" rx="16" fill="none" stroke="#5a5650" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="64" y="172" class="mono" font-size="14" fill="#8a8680" letter-spacing="2">YOUR LAPTOP</text>
<rect x="850" y="140" width="310" height="460" rx="16" fill="none" stroke="#5a5650" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="874" y="172" class="mono" font-size="14" fill="#8a8680" letter-spacing="2">GITHUB</text>
<rect x="70" y="200" width="230" height="150" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="92" y="236" class="sans" font-size="18" fill="#f0ece4" font-weight="700">1 · Working folder</text>
<text x="92" y="264" class="sans" font-size="15" fill="#8a8680">the files you edit</text>
<text x="92" y="318" class="mono" font-size="13" fill="#f0ece4">fct_daily_generation.sql</text>
<rect x="370" y="200" width="400" height="150" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="1.5"/>
<text x="392" y="236" class="sans" font-size="18" fill="#f0ece4" font-weight="700">2 · Local branches</text>
<text x="392" y="264" class="sans" font-size="15" fill="#8a8680">your commits, inside .git</text>
<text x="392" y="300" class="mono" font-size="15" fill="#f0ece4">main</text>
<text x="392" y="328" class="mono" font-size="15" fill="#c8a96e">fix/generation-timezone ← HEAD</text>
<rect x="370" y="440" width="400" height="130" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="392" y="476" class="sans" font-size="18" fill="#f0ece4" font-weight="700">3 · origin/main</text>
<text x="392" y="504" class="sans" font-size="15" fill="#8a8680">a photo of GitHub's main,</text>
<text x="392" y="526" class="sans" font-size="15" fill="#8a8680">taken at your last fetch</text>
<text x="392" y="552" class="mono" font-size="13" fill="#5a5650">git status compares 2 with this</text>
<rect x="880" y="200" width="250" height="370" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="902" y="236" class="sans" font-size="18" fill="#f0ece4" font-weight="700">4 · origin</text>
<text x="902" y="264" class="sans" font-size="15" fill="#8a8680">shared with the team</text>
<text x="902" y="300" class="mono" font-size="15" fill="#f0ece4">main</text>
<text x="902" y="328" class="mono" font-size="13" fill="#f0ece4">fix/generation-timezone</text>
<text x="902" y="380" class="sans" font-size="14" fill="#8a8680">production builds</text>
<text x="902" y="400" class="sans" font-size="14" fill="#8a8680">from main</text>
<line x1="300" y1="275" x2="366" y2="275" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<text x="333" y="262" text-anchor="middle" class="mono" font-size="14" fill="#f0ece4">commit</text>
<line x1="770" y1="260" x2="876" y2="260" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="823" y="247" text-anchor="middle" class="mono" font-size="15" fill="#7a9e7e" font-weight="700">push</text>
<line x1="880" y1="505" x2="774" y2="505" stroke="#c8a96e" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="827" y="492" text-anchor="middle" class="mono" font-size="15" fill="#c8a96e" font-weight="700">fetch</text>
<line x1="570" y1="440" x2="570" y2="354" stroke="#c8a96e" stroke-width="2" marker-end="url(#ao)"/>
<text x="584" y="392" class="mono" font-size="14" fill="#c8a96e">pull · rebase · merge</text>
<text x="54" y="644" class="sans" font-size="16" fill="#8a8680">pull = fetch, then update your branch. Only fetch, pull and push cross to GitHub.</text>
</svg>
