<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" role="img" aria-labelledby="t d">
<title id="t">Where your git code lives</title>
<desc id="d">Your laptop holds a working folder, local branches and an origin/main snapshot. GitHub holds origin. Commit moves work from the folder to local branches, push uploads branches to origin, fetch refreshes the snapshot from origin, and pull, rebase or merge bring the snapshot into your branches.</desc>
<defs>
<style>
.sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e7e"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8a96e"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0ece4"/></marker>
</defs>
<rect width="600" height="1120" rx="20" fill="#0d0d0f"/>
<rect x="1" y="1" width="598" height="1118" rx="19" fill="none" stroke="#2a2924" stroke-width="2"/>
<text x="36" y="54" class="mono" font-size="14" fill="#c8a96e" letter-spacing="2">TELHADO · FICTIONAL</text>
<text x="36" y="92" class="sans" font-size="27" fill="#f0ece4" font-weight="700">Your code lives in four places</text>
<rect x="24" y="126" width="552" height="640" rx="14" fill="none" stroke="#5a5650" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="44" y="156" class="mono" font-size="14" fill="#8a8680" letter-spacing="2">YOUR LAPTOP</text>
<rect x="50" y="176" width="450" height="110" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="72" y="212" class="sans" font-size="20" fill="#f0ece4" font-weight="700">1 · Working folder</text>
<text x="72" y="240" class="sans" font-size="17" fill="#8a8680">the files you edit</text>
<text x="72" y="268" class="mono" font-size="15" fill="#f0ece4">fct_daily_generation.sql</text>
<line x1="275" y1="286" x2="275" y2="336" stroke="#f0ece4" stroke-width="2" marker-end="url(#aw)"/>
<text x="290" y="318" class="mono" font-size="16" fill="#f0ece4">commit</text>
<rect x="50" y="340" width="450" height="150" rx="10" fill="#131311" stroke="#c8a96e" stroke-width="1.5"/>
<text x="72" y="376" class="sans" font-size="20" fill="#f0ece4" font-weight="700">2 · Local branches</text>
<text x="72" y="404" class="sans" font-size="17" fill="#8a8680">your commits, inside .git</text>
<text x="72" y="438" class="mono" font-size="16" fill="#f0ece4">main</text>
<text x="72" y="468" class="mono" font-size="16" fill="#c8a96e">fix/generation-timezone ← HEAD</text>
<line x1="190" y1="590" x2="190" y2="494" stroke="#c8a96e" stroke-width="2" marker-end="url(#ao)"/>
<text x="204" y="548" class="mono" font-size="16" fill="#c8a96e">pull · rebase · merge</text>
<rect x="50" y="594" width="450" height="146" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="72" y="630" class="sans" font-size="20" fill="#f0ece4" font-weight="700">3 · origin/main</text>
<text x="72" y="658" class="sans" font-size="17" fill="#8a8680">a photo of GitHub's main,</text>
<text x="72" y="682" class="sans" font-size="17" fill="#8a8680">taken at your last fetch</text>
<text x="72" y="716" class="mono" font-size="14" fill="#5a5650">git status compares 2 with this</text>
<rect x="24" y="840" width="552" height="200" rx="14" fill="none" stroke="#5a5650" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="44" y="870" class="mono" font-size="14" fill="#8a8680" letter-spacing="2">GITHUB</text>
<rect x="50" y="886" width="450" height="130" rx="10" fill="#131311" stroke="#2a2924" stroke-width="1.5"/>
<text x="72" y="922" class="sans" font-size="20" fill="#f0ece4" font-weight="700">4 · origin</text>
<text x="72" y="950" class="sans" font-size="17" fill="#8a8680">shared; production builds from main</text>
<text x="72" y="990" class="mono" font-size="15" fill="#f0ece4">main · fix/generation-timezone</text>
<polyline points="500,415 540,415 540,951 504,951" fill="none" stroke="#7a9e7e" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="560" y="690" class="mono" font-size="16" fill="#7a9e7e" font-weight="700" transform="rotate(90 560 690)" text-anchor="middle">push</text>
<line x1="380" y1="886" x2="380" y2="744" stroke="#c8a96e" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="394" y="820" class="mono" font-size="16" fill="#c8a96e" font-weight="700">fetch</text>
<text x="36" y="1078" class="sans" font-size="16" fill="#8a8680">pull = fetch, then update your branch.</text>
<text x="36" y="1100" class="sans" font-size="16" fill="#8a8680">Only fetch, pull and push cross to GitHub.</text>
</svg>
