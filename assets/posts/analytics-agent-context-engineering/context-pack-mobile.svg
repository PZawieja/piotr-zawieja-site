<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1390" viewBox="0 0 720 1390" role="img" aria-labelledby="title desc">
  <title id="title">Assemble a task-specific context pack</title>
  <desc id="desc">A vertical diagram shows resort metric definitions and lift telemetry kept in source systems, then selected rules, an alert time window, and lift-level results assembled for a model call.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#77d6a5"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="720" height="1390" rx="26" fill="#121a1e"/>
  <rect x="1" y="1" width="718" height="1388" rx="25" fill="none" stroke="#35433e" stroke-width="2"/>

  <text x="40" y="62" class="mono" font-size="21" letter-spacing="2.5" fill="#77d6a5">FIELD GUIDE · 02</text>
  <text x="40" y="112" class="sans" font-size="34" font-weight="700" fill="#eff6f1">Build a context pack</text>
  <text x="40" y="151" class="sans" font-size="22" fill="#a4b1ac">Retrieve what this question needs.</text>

  <rect x="32" y="190" width="656" height="206" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="234" class="mono" font-size="20" letter-spacing="1.3" fill="#e2bd73">RESORT SYSTEMS</text>
  <text x="62" y="284" class="sans" font-size="26" font-weight="600" fill="#eff6f1">Operations catalog</text>
  <text x="62" y="321" class="sans" font-size="21" fill="#a4b1ac">Metric · lift dimensions · ownership</text>
  <text x="62" y="361" class="sans" font-size="26" font-weight="600" fill="#eff6f1">Lift scans · alert log · freshness</text>
  <path d="M360 407v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="390" y="429" class="mono" font-size="17" fill="#84928c">retrieve just in time</text>

  <rect x="32" y="454" width="656" height="516" rx="18" fill="#1b272b" stroke="#77d6a5" stroke-width="2"/>
  <text x="62" y="498" class="mono" font-size="20" letter-spacing="1.1" fill="#77d6a5">CONTEXT FOR THIS CALL</text>
  <rect x="58" y="526" width="604" height="76" rx="10" fill="#202e32"/>
  <text x="82" y="572" class="sans" font-size="23" font-weight="600" fill="#eff6f1">Rule · use approved measure</text>
  <rect x="58" y="616" width="604" height="76" rx="10" fill="#202e32"/>
  <text x="82" y="662" class="mono" font-size="21" font-weight="600" fill="#d5fa79">median_queue_wait_minutes</text>
  <rect x="58" y="706" width="604" height="76" rx="10" fill="#202e32"/>
  <text x="82" y="752" class="sans" font-size="23" fill="#eff6f1">Frostline · Sat 09:00–11:00</text>
  <rect x="58" y="796" width="604" height="112" rx="10" fill="#202e32"/>
  <text x="82" y="840" class="sans" font-size="23" fill="#8ecff0">Evidence · lift · median · scan count</text>
  <text x="82" y="879" class="sans" font-size="20" fill="#a4b1ac">alert window · source · freshness</text>
  <path d="M360 981v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="32" y="1028" width="656" height="206" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="1072" class="mono" font-size="20" letter-spacing="1.2" fill="#8ecff0">GOVERNED QUERY</text>
  <text x="62" y="1127" class="sans" font-size="31" font-weight="600" fill="#eff6f1">Raven Ridge · 32 min</text>
  <text x="62" y="1170" class="sans" font-size="23" fill="#a4b1ac">47 matched scan pairs</text>
  <text x="62" y="1208" class="sans" font-size="20" fill="#77d6a5">Observed queue, not cause</text>

  <rect x="32" y="1270" width="656" height="76" rx="12" fill="#202e32"/>
  <text x="54" y="1303" class="sans" font-size="20" fill="#a4b1ac">
    <tspan x="54" dy="0">Keep all trail maps, raw scans, and old</tspan>
    <tspan x="54" dy="27">chat out of the model's context.</tspan>
  </text>
</svg>
