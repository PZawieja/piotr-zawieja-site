<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Operate an analytics agent on fresh, traceable evidence</title>
  <desc id="desc">A ferry analytics agent checks source freshness, runs a governed query, records model and tool traces, evaluates the answer, and sends unhealthy signals to an owner.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#77d6a5"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#121a1e"/>
  <rect x="1" y="1" width="1198" height="698" rx="27" fill="none" stroke="#35433e" stroke-width="2"/>
  <text x="54" y="64" class="mono" font-size="18" letter-spacing="3" fill="#77d6a5">FIELD GUIDE · 05</text>
  <text x="54" y="112" class="sans" font-size="35" font-weight="700" fill="#eff6f1">The model is only one dependency</text>
  <text x="54" y="148" class="sans" font-size="20" fill="#a4b1ac">Check evidence freshness, the answer path, and the response to failure.</text>

  <rect x="48" y="210" width="238" height="214" rx="16" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="72" y="250" class="mono" font-size="15" letter-spacing="1" fill="#e2bd73">1 · SOURCE DATA</text>
  <text x="72" y="294" class="sans" font-size="22" font-weight="600" fill="#eff6f1">Vessel telemetry</text>
  <text x="72" y="330" class="sans" font-size="18" fill="#a4b1ac">Last update</text>
  <text x="72" y="362" class="sans" font-size="24" font-weight="700" fill="#df91ae">42 min ago</text>
  <text x="72" y="398" class="sans" font-size="16" fill="#a4b1ac">Beyond the live-answer limit</text>

  <path d="M294 316h29" stroke="#77d6a5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="338" y="210" width="238" height="214" rx="16" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="362" y="250" class="mono" font-size="15" letter-spacing="1" fill="#8ecff0">2 · GOVERNED QUERY</text>
  <text x="362" y="294" class="sans" font-size="22" font-weight="600" fill="#eff6f1">On-time measure</text>
  <text x="362" y="330" class="sans" font-size="18" fill="#a4b1ac">Metric · filters</text>
  <text x="362" y="362" class="sans" font-size="18" fill="#a4b1ac">Query ID · status</text>
  <text x="362" y="398" class="sans" font-size="16" fill="#77d6a5">Versioned evidence</text>

  <path d="M584 316h29" stroke="#77d6a5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="628" y="210" width="238" height="214" rx="16" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="652" y="250" class="mono" font-size="15" letter-spacing="1" fill="#77d6a5">3 · AGENT TRACE</text>
  <text x="652" y="294" class="sans" font-size="22" font-weight="600" fill="#eff6f1">Model + tool spans</text>
  <text x="652" y="330" class="sans" font-size="18" fill="#a4b1ac">Latency · errors</text>
  <text x="652" y="362" class="sans" font-size="18" fill="#a4b1ac">Usage · versions</text>
  <text x="652" y="398" class="sans" font-size="16" fill="#e2bd73">Payloads need care</text>

  <path d="M874 316h29" stroke="#77d6a5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="918" y="210" width="234" height="214" rx="16" fill="#1b272b" stroke="#77d6a5" stroke-width="2"/>
  <text x="942" y="250" class="mono" font-size="15" letter-spacing="1" fill="#77d6a5">4 · USER RESPONSE</text>
  <text x="942" y="298" class="sans" font-size="20" font-weight="600" fill="#eff6f1">“I can’t confirm</text>
  <text x="942" y="328" class="sans" font-size="20" font-weight="600" fill="#eff6f1">the departure yet.”</text>
  <path d="M942 350h186" stroke="#35433e" stroke-width="2"/>
  <text x="942" y="380" class="sans" font-size="15" fill="#a4b1ac">Show last update</text>
  <text x="942" y="403" class="sans" font-size="15" fill="#a4b1ac">Alert the owner</text>

  <path d="M744 438v55H460v-55" fill="none" stroke="#e2bd73" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="486" y="482" class="mono" font-size="14" letter-spacing="1" fill="#e2bd73">EVALUATE · ALERT · FIX THE OWNING LAYER</text>

  <rect x="48" y="550" width="1104" height="72" rx="12" fill="#202e32"/>
  <text x="72" y="580" class="mono" font-size="15" letter-spacing="1" fill="#8ecff0">OBSERVE</text>
  <text x="72" y="606" class="sans" font-size="17" fill="#eff6f1">Freshness · query · model · answer quality</text>
  <path d="M584 565v42" stroke="#35433e" stroke-width="2"/>
  <text x="616" y="580" class="mono" font-size="15" letter-spacing="1" fill="#e2bd73">PROTECT</text>
  <text x="616" y="606" class="sans" font-size="17" fill="#eff6f1">Redact · restrict · retain deliberately</text>
  <text x="54" y="670" class="sans" font-size="16" fill="#84928c">A green model endpoint cannot make stale telemetry current.</text>
</svg>
