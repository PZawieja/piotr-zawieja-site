<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="title desc">
  <title id="title">Operate an analytics agent on fresh, traceable evidence</title>
  <desc id="desc">A mobile operations flow checks source freshness, uses a governed query, records model and tool spans, and gives an explicit stale-data response with an owner alerted.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#77d6a5"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="720" height="1600" rx="26" fill="#121a1e"/>
  <rect x="1" y="1" width="718" height="1598" rx="25" fill="none" stroke="#35433e" stroke-width="2"/>
  <text x="40" y="62" class="mono" font-size="21" letter-spacing="2.5" fill="#77d6a5">FIELD GUIDE · 05</text>
  <text x="40" y="112" class="sans" font-size="34" font-weight="700" fill="#eff6f1">The model is one dependency</text>
  <text x="40" y="151" class="sans" font-size="22" fill="#a4b1ac">Check evidence, traces, and failure behavior.</text>

  <rect x="32" y="190" width="656" height="220" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="234" class="mono" font-size="20" letter-spacing="1.2" fill="#e2bd73">1 · SOURCE DATA</text>
  <text x="62" y="286" class="sans" font-size="28" font-weight="600" fill="#eff6f1">Vessel telemetry</text>
  <text x="62" y="330" class="sans" font-size="22" fill="#a4b1ac">Last update</text>
  <text x="254" y="330" class="sans" font-size="26" font-weight="700" fill="#df91ae">42 min ago</text>
  <text x="62" y="374" class="sans" font-size="20" fill="#a4b1ac">Beyond the live-answer limit</text>
  <path d="M360 419v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="32" y="468" width="656" height="210" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="512" class="mono" font-size="20" letter-spacing="1.2" fill="#8ecff0">2 · GOVERNED QUERY</text>
  <text x="62" y="564" class="sans" font-size="28" font-weight="600" fill="#eff6f1">Approved on-time measure</text>
  <text x="62" y="608" class="sans" font-size="22" fill="#a4b1ac">Metric · filters · query ID · status</text>
  <text x="62" y="646" class="sans" font-size="20" fill="#77d6a5">Versioned evidence</text>
  <path d="M360 687v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="32" y="736" width="656" height="210" rx="18" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="62" y="780" class="mono" font-size="20" letter-spacing="1.2" fill="#77d6a5">3 · AGENT TRACE</text>
  <text x="62" y="832" class="sans" font-size="28" font-weight="600" fill="#eff6f1">Model + tool spans</text>
  <text x="62" y="876" class="sans" font-size="22" fill="#a4b1ac">Latency · errors · usage · versions</text>
  <text x="62" y="914" class="sans" font-size="20" fill="#e2bd73">Sensitive payloads need care</text>
  <path d="M360 955v32" stroke="#77d6a5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="32" y="1004" width="656" height="230" rx="18" fill="#1b272b" stroke="#77d6a5" stroke-width="2"/>
  <text x="62" y="1048" class="mono" font-size="20" letter-spacing="1.2" fill="#77d6a5">4 · USER RESPONSE</text>
  <text x="62" y="1102" class="sans" font-size="27" font-weight="600" fill="#eff6f1">“I can’t confirm the departure yet.”</text>
  <path d="M62 1125h596" stroke="#35433e" stroke-width="2"/>
  <text x="62" y="1168" class="sans" font-size="22" fill="#a4b1ac">Show last update · alert the owner</text>
  <text x="62" y="1208" class="sans" font-size="20" fill="#d5fa79">No silent fallback to stale results</text>
  <path d="M360 1243v32" stroke="#e2bd73" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <rect x="32" y="1292" width="656" height="240" rx="18" fill="#202e32"/>
  <text x="58" y="1338" class="mono" font-size="19" letter-spacing="1" fill="#8ecff0">OBSERVE</text>
  <text x="58" y="1378" class="sans" font-size="21" fill="#eff6f1">Freshness · query · model · answer quality</text>
  <text x="58" y="1423" class="mono" font-size="19" letter-spacing="1" fill="#e2bd73">PROTECT</text>
  <text x="58" y="1463" class="sans" font-size="21" fill="#eff6f1">Redact · restrict · retain deliberately</text>
  <text x="58" y="1508" class="sans" font-size="18" fill="#a4b1ac">A green model endpoint cannot refresh data.</text>
</svg>
