<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Agents Rule of Two for analytics agents</title>
  <desc id="desc">Three overlapping circles: private data, untrusted text, and external communication or state change. Where all three overlap, prompt injection can steal data. Two safe designs each remove one circle.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#121a1e"/>
  <rect x="1" y="1" width="1198" height="698" rx="27" fill="none" stroke="#35433e" stroke-width="2"/>

  <text x="54" y="64" class="mono" font-size="18" letter-spacing="3" fill="#77d6a5">AGENTS RULE OF TWO</text>
  <text x="54" y="110" class="sans" font-size="34" font-weight="700" fill="#eff6f1">Any two legs are manageable. All three steal data.</text>

  <circle cx="250" cy="330" r="125" fill="#8ecff0" fill-opacity="0.13" stroke="#8ecff0" stroke-width="2.5"/>
  <circle cx="400" cy="330" r="125" fill="#e2bd73" fill-opacity="0.13" stroke="#e2bd73" stroke-width="2.5"/>
  <circle cx="325" cy="455" r="125" fill="#ef8f74" fill-opacity="0.13" stroke="#ef8f74" stroke-width="2.5"/>

  <text x="160" y="300" class="sans" font-size="21" font-weight="700" fill="#8ecff0">Private</text>
  <text x="160" y="326" class="sans" font-size="21" font-weight="700" fill="#8ecff0">data</text>
  <text x="430" y="300" class="sans" font-size="21" font-weight="700" fill="#e2bd73">Untrusted</text>
  <text x="430" y="326" class="sans" font-size="21" font-weight="700" fill="#e2bd73">text</text>
  <text x="325" y="530" class="sans" font-size="21" font-weight="700" fill="#ef8f74" text-anchor="middle">Sends, writes</text>
  <text x="325" y="556" class="sans" font-size="21" font-weight="700" fill="#ef8f74" text-anchor="middle">or renders links</text>

  <circle cx="325" cy="378" r="34" fill="#121a1e" stroke="#ef8f74" stroke-width="3"/>
  <text x="325" y="386" class="sans" font-size="22" font-weight="700" fill="#ef8f74" text-anchor="middle">!</text>
  <text x="325" y="650" class="sans" font-size="19" fill="#a4b1ac" text-anchor="middle">Centre: an instruction hidden in a row can exfiltrate data</text>

  <rect x="640" y="160" width="510" height="220" rx="16" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="668" y="198" class="mono" font-size="16" letter-spacing="2" fill="#77d6a5">DESIGN A · CUT UNTRUSTED TEXT</text>
  <text x="668" y="236" class="sans" font-size="20" fill="#eff6f1">Agent reads curated views only</text>
  <text x="668" y="270" class="sans" font-size="18" fill="#a4b1ac">• facts, IDs and flags such as has_note</text>
  <text x="668" y="300" class="sans" font-size="18" fill="#a4b1ac">• no notes, tickets, reviews or web pages</text>
  <text x="668" y="330" class="sans" font-size="18" fill="#a4b1ac">• may post to a fixed channel or open a ticket</text>
  <text x="668" y="360" class="sans" font-size="18" fill="#a4b1ac">• keeps: private data + actions</text>

  <rect x="640" y="410" width="510" height="220" rx="16" fill="#1b272b" stroke="#43534d" stroke-width="2"/>
  <text x="668" y="448" class="mono" font-size="16" letter-spacing="2" fill="#77d6a5">DESIGN B · CUT OUTBOUND + WRITES</text>
  <text x="668" y="486" class="sans" font-size="20" fill="#eff6f1">Agent may read free text, can't act</text>
  <text x="668" y="520" class="sans" font-size="18" fill="#a4b1ac">• read-only role, no write grants</text>
  <text x="668" y="550" class="sans" font-size="18" fill="#a4b1ac">• no fetch_url, no external integrations</text>
  <text x="668" y="580" class="sans" font-size="18" fill="#a4b1ac">• plain-text answers, links not auto-loaded</text>
  <text x="668" y="610" class="sans" font-size="18" fill="#a4b1ac">• keeps: private data + untrusted text</text>
</svg>
