<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Piotr Zawieja</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="https://goldlayer.dev/writing/{{ slug }}.html">
<meta property="og:type" content="article">
<meta property="og:image" content="https://goldlayer.dev/og-default.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0f;
    --surface: #141417;
    --border:  #232328;
    --accent:  #e8d5b0;
    --accent2: #c8a96e;
    --text:    #d4d0c8;
    --muted:   #7a7870;
    --dim:     #4a4844;
    --white:   #f0ece4;
    --mono:    'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --sans:    'Inter', system-ui, -apple-system, sans-serif;
    --serif:   'Playfair Display', 'Georgia', serif;
    --max:     680px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Nav ──────────────────────────────────────────────────── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(13,13,15,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  nav .inner {
    max-width: 860px; margin: 0 auto; padding: 0 1.5rem;
    height: 52px; display: flex; align-items: center; justify-content: space-between;
  }

  .nav-brand { font-family: var(--mono); font-size: 0.8rem; color: var(--accent2); }
  .nav-brand a { color: inherit; text-decoration: none; }
  .nav-back { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  .nav-back:hover { color: var(--accent); }

  /* ─── Article layout ───────────────────────────────────────── */
  .article-wrap { max-width: var(--max); margin: 0 auto; padding: 6rem 1.5rem 5rem; }

  /* ─── Header ───────────────────────────────────────────────── */
  .article-meta { margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }

  .meta-tag {
    font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent2); background: rgba(200,169,110,0.08);
    border: 1px solid rgba(200,169,110,0.2);
    padding: 0.2rem 0.6rem; border-radius: 3px;
  }

  .meta-date { font-family: var(--mono); font-size: 0.72rem; color: var(--dim); }

  .article-title {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    line-height: 1.15; letter-spacing: -0.02em;
    color: var(--white); margin-bottom: 1.5rem;
  }

  .article-lede {
    font-size: 1.05rem; color: var(--muted);
    line-height: 1.7; margin-bottom: 2rem;
    padding-bottom: 2rem; border-bottom: 1px solid var(--border);
  }

  /* ─── Body ─────────────────────────────────────────────────── */
  .article-body { font-size: 1rem; line-height: 1.8; }

  .article-body p { margin-bottom: 1.3rem; color: var(--text); }

  .article-body h2 {
    font-family: var(--serif); font-size: 1.45rem; font-weight: 700;
    color: var(--white); letter-spacing: -0.02em;
    margin: 2.5rem 0 1rem;
  }

  .article-body h3 {
    font-family: var(--sans); font-size: 1rem; font-weight: 600;
    color: var(--white); margin: 2rem 0 0.75rem;
  }

  .article-body strong { color: var(--white); font-weight: 600; }

  .article-body a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(232,213,176,0.3); }
  .article-body a:hover { color: var(--white); }

  .article-body hr {
    border: none; border-top: 1px solid var(--border);
    margin: 2.5rem 0;
  }

  /* ─── Code ─────────────────────────────────────────────────── */
  .article-body code {
    font-family: var(--mono); font-size: 0.85em;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--accent); border-radius: 3px;
    padding: 0.1em 0.4em;
  }

  .article-body pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 1.25rem 1.5rem;
    margin: 1.5rem 0; overflow-x: auto;
  }

  .article-body pre code {
    background: none; border: none; padding: 0;
    color: var(--text); font-size: 0.82rem; line-height: 1.6;
  }

  .article-body pre .comment { color: var(--dim); }
  .article-body pre .keyword { color: var(--accent2); }
  .article-body pre .string  { color: var(--accent); }
  .article-body pre .tag     { color: var(--muted); }

  /* ─── Lists ────────────────────────────────────────────────── */
  .article-body ul {
    list-style: none; margin: 1rem 0 1.3rem; padding: 0;
    display: flex; flex-direction: column; gap: 0.5rem;
  }

  .article-body ul li { padding-left: 1.25rem; position: relative; }
  .article-body ul li::before {
    content: '—'; position: absolute; left: 0;
    color: var(--accent2); font-family: var(--mono); font-size: 0.8em;
  }

  /* ─── Comparison grids (tradeoff-grid / strategy-grid) ────── */
  .tradeoff-grid, .strategy-grid {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin: 1.5rem 0;
    font-size: 0.87rem;
  }

  .tradeoff-row, .strategy-row {
    display: grid;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }

  .tradeoff-row { grid-template-columns: repeat(4, 1fr); }
  .strategy-row { grid-template-columns: repeat(3, 1fr); }

  .tradeoff-row:last-child, .strategy-row:last-child { border-bottom: none; }

  .tradeoff-row.header, .strategy-row.header {
    background: var(--surface);
  }

  .tradeoff-row.header .tradeoff-cell,
  .strategy-row.header .strategy-cell {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent2);
  }

  .tradeoff-cell, .strategy-cell {
    padding: 0.7rem 0.9rem;
    border-right: 1px solid var(--border);
    color: var(--text);
    line-height: 1.5;
  }

  .tradeoff-cell:last-child, .strategy-cell:last-child { border-right: none; }

  /* ─── Timestamp definition block (ts-block) ────────────────── */
  .ts-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 1.5rem 0;
    overflow: hidden;
  }

  .ts-row {
    display: grid;
    grid-template-columns: 14rem 1fr;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }

  .ts-row:last-child { border-bottom: none; }

  .ts-label {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--accent2);
    padding: 0.75rem 1rem;
    border-right: 1px solid var(--border);
    background: rgba(200,169,110,0.04);
  }

  .ts-desc {
    padding: 0.75rem 1rem;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.6;
  }

  /* ─── doc-table / generic article tables ───────────────────── */
  .article-body table, .doc-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    font-size: 0.87rem;
  }

  .article-body th, .doc-table th {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent2);
    padding: 0.6rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: left;
  }

  .article-body td, .doc-table td {
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--border);
    color: var(--text);
    line-height: 1.5;
  }

  /* ─── Takeaways ────────────────────────────────────────────── */
  .takeaways {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 6px; padding: 1.5rem 1.5rem 1.5rem 1.75rem;
    margin: 2rem 0;
  }

  .takeaways h2 {
    font-size: 0.75rem !important; font-family: var(--mono) !important;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent2) !important; margin: 0 0 1rem !important;
  }

  .takeaways ul { margin: 0 !important; }

  .takeaways ul li { color: var(--text); font-size: 0.92rem; }

  /* ─── Byline ───────────────────────────────────────────────── */
  .article-footer {
    margin-top: 3rem; padding-top: 2rem;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
  }

  .byline { font-size: 0.85rem; color: var(--muted); }
  .byline strong { color: var(--white); }

  .back-link {
    font-family: var(--mono); font-size: 0.75rem;
    color: var(--muted); text-decoration: none;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }

  /* ─── Mobile ───────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .article-wrap { padding: 5rem 1.25rem 4rem; }
    .article-body pre { padding: 1rem; margin: 1.25rem -0.25rem; border-radius: 4px; }
    .tradeoff-row { grid-template-columns: 1fr 1fr; }
    .tradeoff-row.header .tradeoff-cell:nth-child(n+3),
    .tradeoff-row .tradeoff-cell:nth-child(n+3) { display: none; }
    .strategy-row { grid-template-columns: 1fr 1fr; }
    .strategy-row.header .strategy-cell:last-child,
    .strategy-row .strategy-cell:last-child { display: none; }
    .ts-row { grid-template-columns: 1fr; }
    .ts-label { border-right: none; border-bottom: 1px solid var(--border); }
    .article-body table, .doc-table { display: block; overflow-x: auto; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<nav>
  <div class="inner">
    <span class="nav-brand"><a href="../index.html">goldlayer.dev</a></span>
    <a href="../writing/" class="nav-back">← writing</a>
  </div>
</nav>

<article class="article-wrap">

  <header>
    <div class="article-meta">
      {% for tag in tags %}<span class="meta-tag">{{ tag }}</span>
      {% endfor %}<span class="meta-date">{{ date_formatted }} · {{ read_time }} min read</span>
    </div>
    <h1 class="article-title">{{ title }}</h1>
    <p class="article-lede">{{ description }}</p>
  </header>

  <div class="article-body">
    {{ content | safe }}
  </div>

  <footer class="article-footer">
    <p class="byline">Written by <strong>Piotr Zawieja</strong> — Analytics Engineer. All code examples use synthetic data.</p>
    <a href="../writing/" class="back-link">← all writing</a>
  </footer>

</article>

</body>
</html>
